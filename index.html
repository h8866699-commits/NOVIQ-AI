<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="NOVIQ AI — Your AI. Your Future.">
  <title>NOVIQ AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#08090d;--panel:#0d0f15;--panel2:#12151d;--line:#232632;--text:#f3f5fb;--muted:#8b91a3;--accent:#a7a5ff;--cyan:#7ce7ff;--danger:#ff8c9a}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at 50% -18%,#1a1c36 0,transparent 42%),var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
    button,textarea,input{font:inherit}button{cursor:pointer}
    .app{display:flex;min-height:100vh}
    .sidebar{width:278px;flex-shrink:0;background:rgba(10,11,16,.94);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;transition:transform .25s ease}
    .brand{display:flex;align-items:center;gap:11px;padding:4px 7px 12px}
    .brand-mark{width:37px;height:37px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#a7a5ff,#75e6ff);color:#080a12;font-size:21px;font-weight:800;box-shadow:0 0 26px #8b8bff25}
    .brand-name{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;letter-spacing:.2px}.brand-name span{color:#a7a5ff}
    .new-chat{width:100%;border:1px solid #343648;border-radius:13px;padding:12px 13px;color:#f5f6ff;background:linear-gradient(110deg,#171925,#10121a);display:flex;gap:10px;align-items:center;transition:.2s}
    .new-chat:hover{border-color:#8f8dff;transform:translateY(-1px)}
    .section-label{font-size:11px;letter-spacing:1.5px;color:#777e92;font-weight:700;padding:5px 9px}
    .history{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:calc(100vh - 250px)}
    .history-item{border:1px solid transparent;background:transparent;color:#bfc3d1;border-radius:10px;padding:10px 11px;text-align:left;display:flex;gap:9px;align-items:center;min-width:0}
    .history-item:hover,.history-item.active{background:#171923;border-color:#252938;color:white}
    .history-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:13px}
    .delete-chat{opacity:0;border:0;background:transparent;color:#8b91a3;padding:2px 4px}.history-item:hover .delete-chat{opacity:1}.delete-chat:hover{color:var(--danger)}
    .sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:15px 8px 0;color:#71788a;font-size:12px;line-height:1.6}
    .sidebar-bottom b{color:#bfc4d5}
    .main{min-width:0;flex:1;display:flex;flex-direction:column;height:100vh;height:100dvh}
    .topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 27px;border-bottom:1px solid #1d202b;background:#08090dbb;backdrop-filter:blur(16px);flex-shrink:0}
    .top-left{display:flex;align-items:center;gap:12px}.top-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600}.model-pill{font-size:11px;color:#bcbaff;border:1px solid #37344f;background:#171629;padding:5px 9px;border-radius:99px}
    .icon-btn{height:36px;width:36px;border:1px solid var(--line);background:#11131a;color:#c9ccda;border-radius:11px;display:grid;place-items:center}.icon-btn:hover{border-color:#6665a5;color:white}
    .mobile-menu{display:none}
    .chat-scroll{flex:1;overflow:auto;scroll-behavior:smooth;padding:32px 20px 20px}
    .content{max-width:800px;margin:0 auto;width:100%}
    .welcome{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0 34px;animation:rise .65s ease both}
    .orb-wrap{width:104px;height:104px;position:relative;display:grid;place-items:center;margin-bottom:28px}
    .orb-glow{position:absolute;inset:5px;border-radius:35px;background:linear-gradient(135deg,#a8a5ff,#7ce7ff);filter:blur(25px);opacity:.28;animation:pulse 3s ease-in-out infinite}
    .orb{position:relative;width:83px;height:83px;border-radius:27px;display:grid;place-items:center;background:linear-gradient(145deg,#20223a,#111522);border:1px solid #5e5e94;box-shadow:inset 0 1px 1px #ffffff25,0 0 40px #7774ff22;transform:rotate(-5deg)}
    .orb svg{width:46px;height:46px;transform:rotate(5deg)}
    .eyebrow{font-size:11px;letter-spacing:3px;color:#a7a5ff;font-weight:700;margin-bottom:15px}
    h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(34px,5vw,52px);line-height:1.08;letter-spacing:-2px;margin:0 0 14px}
    h1 .gradient{background:linear-gradient(100deg,#f7f7ff 15%,#b2aaff 53%,#7ce7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .welcome-sub{color:#969caf;font-size:15px;line-height:1.7;max-width:440px;margin:0 0 34px}
    .suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:610px}
    .suggestion{border:1px solid #282b38;background:linear-gradient(135deg,#11131b,#0c0e14);border-radius:15px;padding:15px;text-align:left;color:#e5e7f1;display:flex;gap:12px;align-items:flex-start;transition:transform .2s,border-color .2s,background .2s}
    .suggestion:hover{transform:translateY(-3px);border-color:#6c68a9;background:#171827}
    .s-icon{width:32px;height:32px;flex-shrink:0;display:grid;place-items:center;border-radius:10px;background:#23213c;color:#b8b5ff}
    .suggestion b{display:block;font-size:13px;margin:1px 0 5px}.suggestion small{display:block;font-size:11px;line-height:1.45;color:#8f95a8}
    .messages{display:flex;flex-direction:column;gap:25px;padding:10px 0 30px}
    .message{display:flex;gap:13px;align-items:flex-start;animation:rise .25s ease both}
    .avatar{width:32px;height:32px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:13px;font-weight:700}
    .avatar.ai{background:linear-gradient(135deg,#a7a5ff,#7ce7ff);color:#08090d}
    .avatar.user{background:#252837;color:#e8eaff}
    .message-body{min-width:0;flex:1;padding-top:5px}
    .message-name{font-size:12px;font-weight:700;color:#b8bcd0;margin-bottom:8px}
    .message-text{font-size:14px;line-height:1.8;color:#e0e3ed;white-space:pre-wrap;overflow-wrap:anywhere}
    .message-text a{color:#a7dfff}.message-actions{display:flex;gap:7px;margin-top:10px}
    .tiny-btn{border:1px solid #292d3b;background:#11131a;color:#8d94a8;border-radius:8px;padding:5px 8px;font-size:11px}.tiny-btn:hover{color:white}
    .typing{display:flex;gap:5px;padding:5px 0}.typing span{width:6px;height:6px;border-radius:50%;background:#a7a5ff;animation:dot 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
    .composer-area{padding:12px 20px 18px;background:linear-gradient(transparent,#08090d 20%);flex-shrink:0}
    .composer{max-width:800px;margin:0 auto;border:1px solid #303342;border-radius:20px;background:linear-gradient(145deg,#151720,#101117);padding:11px 12px 9px;box-shadow:0 14px 45px #0005;transition:border-color .2s,box-shadow .2s}
    .composer:focus-within{border-color:#7773c5;box-shadow:0 0 0 3px #8b85ff12,0 14px 45px #0005}
    textarea{display:block;width:100%;resize:none;max-height:170px;min-height:35px;border:0;outline:0;background:transparent;color:#f4f5fb;padding:5px 6px 9px;font-size:14px;line-height:1.6}textarea::placeholder{color:#71778b}
    .composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .composer-hint{font-size:10px;color:#747b8e;padding-left:6px}
    .send-btn{width:37px;height:37px;border:0;border-radius:12px;background:linear-gradient(135deg,#b4adff,#7ce7ff);color:#080a12;display:grid;place-items:center;transition:transform .2s,opacity .2s}.send-btn:hover{transform:scale(1.05)}.send-btn:disabled{opacity:.4;cursor:not-allowed}
    .disclaimer{text-align:center;font-size:10px;color:#60677a;max-width:800px;margin:10px auto 0}
    .toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,12px);background:#1b1e2a;border:1px solid #383c50;color:#eef0fa;padding:10px 15px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
    .empty-history{color:#73798b;font-size:12px;padding:8px 10px}
    @keyframes pulse{0%,100%{transform:scale(.88);opacity:.2}50%{transform:scale(1.12);opacity:.4}}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
    @media(max-width:760px){.sidebar{position:fixed;z-index:20;inset:0 auto 0 0;transform:translateX(-105%);box-shadow:20px 0 60px #0008}.sidebar.open{transform:translateX(0)}.mobile-menu{display:grid}.topbar{padding:0 15px;height:60px}.chat-scroll{padding:20px 15px 10px}.composer-area{padding:10px 12px 12px}.suggestions{grid-template-columns:1fr}.welcome{justify-content:center;padding-top:5px}.orb-wrap{width:84px;height:84px;margin-bottom:22px}.orb{width:70px;height:70px;border-radius:23px}.orb svg{width:38px}.welcome-sub{font-size:13px;margin-bottom:25px}h1{letter-spacing:-1.4px}.composer{border-radius:17px}.message-text{font-size:13px}.sidebar-backdrop{display:none;position:fixed;inset:0;background:#0008;z-index:19}.sidebar-backdrop.show{display:block}}
    @media(min-width:761px){.sidebar{transform:none!important}}
  </style>
</head>
<body>
<div class="app">
  <div class="sidebar-backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div class="brand-name">NOVIQ <span>AI</span></div>
    </div>
    <button class="new-chat" id="newChat"><span>＋</span> New conversation <span style="margin-left:auto;color:#777d91">⌘ K</span></button>
    <div class="section-label">YOUR HISTORY</div>
    <div class="history" id="historyList"></div>
    <div class="sidebar-bottom"><b>✦ NOVIQ AI</b><br>Your AI. Your Future.<br><span style="color:#555c70">Chats are saved in this browser.</span></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button>
        <div class="top-title">NOVIQ AI</div>
        <div class="model-pill">✦ Gemini-powered</div>
      </div>
      <button class="icon-btn" id="clearBtn" title="Start a new chat" aria-label="New chat">＋</button>
    </header>

    <section class="chat-scroll" id="chatScroll">
      <div class="content" id="content"></div>
    </section>

    <div class="composer-area">
      <form class="composer" id="chatForm">
        <textarea id="prompt" rows="1" placeholder="Message NOVIQ AI..." aria-label="Message NOVIQ AI"></textarea>
        <div class="composer-bottom">
          <div class="composer-hint">↵ Send · Shift + ↵ New line</div>
          <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14-7-4 14-3-6-7-1Z"/><path d="M12 13 19 5"/></svg>
          </button>
        </div>
      </form>
      <div class="disclaimer">NOVIQ AI can make mistakes. Check important information.</div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const STORAGE_KEY = "noviq_ai_chats_v1";
  let chats = loadChats();
  let activeId = null;
  let busy = false;

  const icon = {
    bulb: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 22h4M8 14c-1.3-1-2-2.5-2-4a6 6 0 1 1 12 0c0 1.5-.7 3-2 4-.6.5-1 1.2-1 2H9c0-.8-.4-1.5-1-2Z"/></svg>',
    code: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 4l-4 16"/></svg>',
    pen: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 20 9-9-8-8-9 9-1 7 9 1Z"/><path d="m13 4 8 8"/></svg>',
    book: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20"/></svg>'
  };

  function loadChats() {
    try { const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); return Array.isArray(data) ? data : []; }
    catch { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); }
    catch { toast("Browser storage is full. Consider deleting old chats."); }
    renderHistory();
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function currentChat() { return chats.find(c => c.id === activeId); }
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove("show"), 2400);
  }
  function renderHistory() {
    const list = $("historyList");
    if (!chats.length) { list.innerHTML = '<div class="empty-history">Your conversations will appear here.</div>'; return; }
    list.innerHTML = [...chats].sort((a,b) => b.updated - a.updated).map(c =>
      `<button class="history-item ${c.id === activeId ? 'active' : ''}" data-open="${c.id}">
        <span style="color:#8f8bda">▤</span><span class="history-title">${escapeHTML(c.title || "New conversation")}</span>
        <span class="delete-chat" data-delete="${c.id}" title="Delete chat" role="button" aria-label="Delete chat">×</span>
      </button>`).join("");
  }
  function welcomeHTML() {
    return `<div class="welcome">
      <div class="orb-wrap"><div class="orb-glow"></div><div class="orb">
        <svg viewBox="0 0 64 64" fill="none"><path d="M32 5 38.8 25.2 59 32 38.8 38.8 32 59 25.2 38.8 5 32 25.2 25.2 32 5Z" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/><path d="m48 5 2.8 8.2L59 16l-8.2 2.8L48 27l-2.8-8.2L37 16l8.2-2.8L48 5Z" fill="#7ce7ff"/><defs><linearGradient id="g" x1="5" y1="5" x2="59" y2="59"><stop stop-color="#c5bfff"/><stop offset="1" stop-color="#7ce7ff"/></linearGradient></defs></svg>
      </div></div>
      <div class="eyebrow">YOUR INTELLIGENCE, REIMAGINED</div>
      <h1>Meet your new<br><span class="gradient">thinking partner.</span></h1>
      <p class="welcome-sub">Ideas, answers, creativity and code — start with a question and see where it takes you.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Explain a difficult topic in simple words"><span class="s-icon">${icon.bulb}</span><span><b>Learn something new</b><small>Explain any topic simply</small></span></button>
        <button class="suggestion" data-prompt="Help me build a website from scratch"><span class="s-icon">${icon.code}</span><span><b>Build something</b><small>Code, debug and create</small></span></button>
        <button class="suggestion" data-prompt="Help me brainstorm 10 creative YouTube video ideas"><span class="s-icon">${icon.pen}</span><span><b>Get creative</b><small>Ideas, stories and writing</small></span></button>
        <button class="suggestion" data-prompt="Create a simple study plan for this week"><span class="s-icon">${icon.book}</span><span><b>Plan your day</b><small>Turn goals into clear steps</small></span></button>
      </div>
    </div>`;
  }
  function renderMessages() {
    const chat = currentChat();
    if (!chat || !chat.messages.length) {
      $("content").innerHTML = welcomeHTML();
      return;
    }
    $("content").innerHTML = `<div class="messages" id="messages">${chat.messages.map((m,i) => `
      <article class="message">
        <div class="avatar ${m.role === 'assistant' ? 'ai' : 'user'}">${m.role === 'assistant' ? '✦' : 'Y'}</div>
        <div class="message-body">
          <div class="message-name">${m.role === 'assistant' ? 'NOVIQ AI' : 'You'}</div>
          <div class="message-text">${escapeHTML(m.content)}</div>
          ${m.role === 'assistant' ? `<div class="message-actions"><button class="tiny-btn" data-copy="${i}">Copy response</button></div>` : ''}
        </div>
      </article>`).join("")}</div>`;
    $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
  }
  function renderAll() { renderHistory(); renderMessages(); }
  function startNewChat() {
    if (busy) return;
    activeId = null;
    renderAll();
    $("prompt").focus();
    closeSidebar();
  }
  function ensureChat(firstText) {
    let chat = currentChat();
    if (!chat) {
      chat = {id:uid(), title:firstText.slice(0,42) + (firstText.length > 42 ? "…" : ""), messages:[], updated:Date.now()};
      chats.push(chat); activeId = chat.id;
    }
    return chat;
  }
  function addMessage(role, content) {
    const chat = currentChat();
    chat.messages.push({role, content});
    chat.updated = Date.now();
    save(); renderMessages();
  }
  function showTyping() {
    $("content").insertAdjacentHTML("beforeend", `<div class="message" id="typingIndicator"><div class="avatar ai">✦</div><div class="message-body"><div class="message-name">NOVIQ AI</div><div class="typing"><span></span><span></span><span></span></div></div></div>`);
    $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
  }
  async function sendMessage(text) {
    text = text.trim();
    if (!text || busy) return;
    const chat = ensureChat(text);
    busy = true; $("sendBtn").disabled = true;
    $("prompt").value = ""; resizeTextarea();
    addMessage("user", text);
    showTyping();
    try {
      const messages = currentChat().messages.map(m => ({role:m.role, content:m.content}));
      const response = await fetch("/api/chat", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages})
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || "Something went wrong. Please try again.");
      $("typingIndicator")?.remove();
      addMessage("assistant", data.reply || "I couldn't create a response. Please try again.");
    } catch (err) {
      $("typingIndicator")?.remove();
      addMessage("assistant", "Sorry — " + (err.message || "I couldn't connect right now.") + "\n\nPlease check your connection and try again.");
      toast("Couldn't reach NOVIQ AI");
    } finally {
      busy = false; $("sendBtn").disabled = false; $("prompt").focus();
    }
  }
  function resizeTextarea() {
    const el = $("prompt"); el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 170) + "px";
  }
  function openSidebar() { $("sidebar").classList.add("open"); $("backdrop").classList.add("show"); }
  function closeSidebar() { $("sidebar").classList.remove("open"); $("backdrop").classList.remove("show"); }

  $("newChat").addEventListener("click", startNewChat);
  $("clearBtn").addEventListener("click", startNewChat);
  $("menuBtn").addEventListener("click", openSidebar);
  $("backdrop").addEventListener("click", closeSidebar);
  $("chatForm").addEventListener("submit", e => { e.preventDefault(); sendMessage($("prompt").value); });
  $("prompt").addEventListener("input", resizeTextarea);
  $("prompt").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("chatForm").requestSubmit(); }
  });
  $("historyList").addEventListener("click", e =
